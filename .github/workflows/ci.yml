name: TENSORRA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Model Lab syntax
        run: python3 -m py_compile model-lab/prepare_sft.py model-lab/prepare_preferences.py model-lab/train_sft_lora.py model-lab/train_dpo_lora.py model-lab/compare_endpoints.py

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://hlfjkfvlreqxvgjvyffp.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_CWEL6ZEDKuUN3U_WtdiUCQ_jUIVruXg
          GROQ_API_KEY: placeholder_ci_only
